procedure_key: agenr/release
title: Release agenr and publish packages
goal: Cut a release from local master, validate it, and publish the CLI and plugin packages safely.
when_to_use:
  - You need to ship a new agenr release for this repository.
  - You need the canonical sequence for version bumps, changelog updates, validation, and publish.
when_not_to_use:
  - You only need a local build or sandbox validation.
  - You are working on ordinary feature development that should stay on a feature branch.
prerequisites:
  - The user has supplied an exact target version.
  - Local master is available and safe for release work.
  - Publish credentials are configured for the root package and the OpenClaw plugin package.
steps:
  - id: read-release-workflow
    kind: read_reference
    instruction: Read the repo-owned release workflow before editing any release files.
    ref:
      kind: skill
      path: .cursor/skills/agenr-release/SKILL.md
  - id: inspect-release-state
    kind: inspect_state
    instruction: Confirm the repository is on local master, review unreleased commits, and check whether the working tree is safe for a release.
    target: local git state
    query: Inspect the current branch, uncommitted changes, and the diff between origin/master and local master before making release edits.
  - id: collect-target-version
    kind: ask_user
    instruction: Do not infer the version automatically.
    prompt: Ask the user for the exact release version if it was not already provided.
  - id: run-pre-release-validation
    kind: run_command
    instruction: Run the required repository validation command before changing versions or the changelog.
    command: pnpm check
  - id: align-release-versions
    kind: edit_file
    instruction: Keep the published package versions perfectly aligned for the release.
    path: package.json
    edit: Update the root package version, packages/openclaw-plugin/package.json, and packages/openclaw-plugin/openclaw.plugin.json to the exact same release version.
  - id: update-changelog
    kind: edit_file
    instruction: Write the release entry from the unreleased local-master delta, not from the upcoming release commit.
    path: CHANGELOG.md
    edit: Insert a new release section directly under Unreleased using the diff between origin/master and local master.
  - id: commit-release
    kind: run_command
    instruction: Commit the release work on local master using the current repo commit-message style.
    command: git add package.json packages/openclaw-plugin/package.json packages/openclaw-plugin/openclaw.plugin.json CHANGELOG.md && git commit
  - id: pause-for-approval
    kind: ask_user
    instruction: Pushing and publishing are irreversible enough to require an explicit stop.
    prompt: Show the release summary and ask for explicit approval before pushing local master or publishing packages.
  - id: push-master
    kind: run_command
    instruction: Push the release commit only after explicit user approval.
    command: git push origin master
    conditions:
      - kind: user_confirmed
        value: release-push-approved
  - id: build-release-artifacts
    kind: run_command
    instruction: Build the repository after the release commit is ready to publish.
    command: pnpm build
    conditions:
      - kind: user_confirmed
        value: release-push-approved
  - id: publish-root-package
    kind: run_command
    instruction: Publish the root agenr package after the push succeeds.
    command: pnpm publish
    conditions:
      - kind: user_confirmed
        value: release-publish-approved
  - id: publish-plugin-package
    kind: run_command
    instruction: Publish the OpenClaw plugin package after the root package publish succeeds.
    command: pnpm --filter @agenr/agenr-plugin publish
    conditions:
      - kind: user_confirmed
        value: release-publish-approved
  - id: verify-release
    kind: verify
    instruction: Confirm the release completed cleanly.
    checks:
      - The versions in package.json, packages/openclaw-plugin/package.json, and packages/openclaw-plugin/openclaw.plugin.json match the requested release.
      - pnpm check passed before the release edits were committed.
      - The release commit exists on local master before any publish step runs.
      - The root package and plugin package publish steps both report success.
verification:
  - The repo versions, changelog, and release commit all match the requested release.
  - The release was validated before publish and paused for user approval before push and publish.
  - Both npm packages were published from the intended release commit.
failure_modes:
  - The user did not provide an exact target version.
  - pnpm check fails and the release work continues anyway.
  - The changelog summarizes the wrong commit range.
  - One package publishes successfully while the other fails, leaving a partial release state.
sources:
  - kind: skill
    path: .cursor/skills/agenr-release/SKILL.md
  - kind: doc
    path: AGENTS.md
  - kind: doc
    path: README.md
